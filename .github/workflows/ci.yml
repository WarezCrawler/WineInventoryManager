name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repo is public: personal and business data must never be tracked.
      - name: No data files tracked
        run: |
          if git ls-files | grep -i -E '\.(accdb|laccdb|mdb|csv|db|sqlite3?|dump)$'; then
            echo "Data files must not be committed (see .gitignore)"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest

[pytest]
pythonpath = .
testpaths = tests
# Click-through tests (tests/test_ui.py): NiceGUI's simulated user, without a main file; the
# tests load the page modules themselves. Needs requirements-test.txt.
addopts = -p nicegui.testing.user_plugin
main_file =
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
